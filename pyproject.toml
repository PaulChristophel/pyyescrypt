[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyyescrypt"
version = "0.2.1"
description = "Python bindings for yescrypt using a tiny Go shared library"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[project.scripts]
pyyescrypt-cli = "pyyescrypt._cli_launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyyescrypt", "pyyescrypt.*"]

[tool.setuptools.package-data]
pyyescrypt = ["py.typed", "_native/**/*", "_cli/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
skip = ["*-win32", "*-win_amd64", "*-win_arm64"]
build-verbosity = 1
test-requires = ["pytest"]

# Build one py3-none wheel per platform, then reuse it to test the available
# CPython versions. requires-python supplies the minimum supported version.
build = "cp3*-*"

[tool.cibuildwheel.linux]
# archs = ["x86_64", "aarch64"]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_34"
# manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
# musllinux-aarch64-image = "musllinux_1_2"
